name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME.slice(1);
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^\[package\]\s*\n(?:(?!\[)[^\n]*\n)*?version\s*=\s*"([^"]+)"/m)?.[1];
          for (const [file, version] of Object.entries({ 'package.json': packageVersion, 'tauri.conf.json': tauriVersion, 'Cargo.toml': cargoVersion })) {
            if (!tag || version !== tag) {
              console.error(`Version mismatch: tag=${tag}, ${file}=${version}`);
              process.exitCode = 1;
            }
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: ./scripts/prepare-sidecar.sh aarch64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTIST_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          DOTIST_UPDATE_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json --bundles app
          tagName: ${{ github.ref_name }}
          releaseName: 'Dotist ${{ github.ref_name }}'
          releaseDraft: true
          includeUpdaterJson: true
