name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dotist-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Set the native build version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path('native/app.json')
          config = json.loads(path.read_text())
          match = re.fullmatch(r'(\d+)\.(\d+)\.0', config['version'])
          if not match:
              raise SystemExit('The source version must end in .0')
          version = f'{match[1]}.{match[2]}.{os.environ["GITHUB_RUN_NUMBER"]}'
          config['version'] = version
          path.write_text(json.dumps(config, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Test the native application
        run: bash native/scripts/test-native.sh
      - name: Build the native application
        run: |
          test "$(uname -m)" = arm64
          bash native/scripts/build-local.sh > "$RUNNER_TEMP/native-build.log"
          cat "$RUNNER_TEMP/native-build.log"
          app=$(sed -n 's/^Local application: //p' "$RUNNER_TEMP/native-build.log" | tail -n 1)
          echo "DOTIST_RELEASE_APP=$app" >> "$GITHUB_ENV"
      - name: Sign and verify native Sparkle update
        env:
          SPARKLE_SIGNING_PRIVATE_KEY: ${{ secrets.SPARKLE_SIGNING_PRIVATE_KEY }}
        run: |
          python3 native/scripts/package-update.py "$DOTIST_RELEASE_APP" --output .cache/native-release
          python3 native/scripts/verify-update.py .cache/native-release
      - name: Upload the complete draft and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("native/app.json"))["version"])')"
          tag="v$version"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Dotist v$version" --notes-file docs/release-notes.md \
            .cache/native-release/Dotist_darwin_aarch64.app.tar.gz .cache/native-release/appcast.xml
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main; leaving this release as a draft.'
            exit 0
          fi
          gh release download "$tag" --dir "$RUNNER_TEMP/published-assets"
          python3 native/scripts/verify-update.py "$RUNNER_TEMP/published-assets"
          gh release edit "$tag" --draft=false --latest
