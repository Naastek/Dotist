[package]
name = "dotist-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
dotist-core = { path = "../dotist-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
auto-launch = "0.6"
regex = "1"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
