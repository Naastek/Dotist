<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dotist · 拖动模型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1ed;color:#282721;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.layout{display:flex;gap:24px;align-items:flex-start;justify-content:center;padding:38px 20px}.panel{width:364px;flex:none;background:#fffefa;border:1px solid #e5e2da;border-radius:14px;box-shadow:0 12px 35px #37312a12;overflow:hidden}.top{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center}.top strong{font:700 19px Georgia,serif}.top span{color:#aaa59a}.list{position:relative;margin:0 12px 16px;touch-action:none;user-select:none}.item{position:absolute;left:0;right:0;top:0;transition:transform 140ms ease-out}.title{height:36px;display:flex;align-items:center;padding-left:8px;font:700 16px Georgia,serif;color:#565147}.row{height:32px;display:flex;align-items:center;padding-right:8px;cursor:grab;border-radius:6px;white-space:nowrap}.row.sub{height:28px}.row:hover{background:#f5f3ee}.circle{width:15px;height:15px;border:1.5px solid #bbb8ae;border-radius:50%;margin-right:9px;flex:none}.label{overflow:hidden;text-overflow:ellipsis}.grip{margin-left:auto;padding-left:5px;color:#ccc6bb;opacity:0}.row:hover .grip{opacity:1}.gap{position:absolute;left:2px;right:2px;top:0;border-radius:7px;background:#e8ece6;border:1px dashed #9eac9d;transition:transform 140ms ease-out;pointer-events:none}.gap:before{content:'放在这里';position:absolute;right:8px;top:5px;color:#899789;font-size:10px}.floating{position:absolute;left:0;right:0;top:0;z-index:5;background:#fffefa;border-radius:7px;box-shadow:0 5px 18px #2827212e;pointer-events:none;will-change:transform}.floating .row{background:#fffefa}.floating .row:first-child{border-radius:7px 7px 0 0}.line{position:absolute;width:1px;background:#aeb9a9;z-index:2;pointer-events:none}.debug{width:300px;background:#fffefa;border:1px solid #e5e2da;border-radius:12px;padding:18px;line-height:1.5}.debug h2{margin:0 0 5px;font:700 17px Georgia,serif}.debug p{color:#817d72;margin:0 0 14px}.toggle{display:flex;align-items:center;gap:8px;margin:12px 0 16px}.metrics{font:12px ui-monospace,monospace;white-space:pre-wrap;color:#5d5a51}.checks{margin-top:14px;border-top:1px solid #eeeae2;padding-top:10px}.check{padding:3px 0;color:#6e796c}.check.bad{color:#c44037;font-weight:600}.hint{margin-top:16px!important;font-size:12px}@media(max-width:760px){.layout{flex-direction:column;align-items:center;padding:16px}.debug{width:364px}}@media(prefers-reduced-motion:reduce){.item,.gap{transition:none!important}}body.reduce .item,body.reduce .gap{transition:none!important}
</style>
<div class="layout"><section class="panel"><div class="top"><strong>Today</strong><span>···</span></div><div id="list" class="list"></div></section><aside class="debug"><h2>Drag model</h2><p>拖动任务，试试跨组、缩进和子树。</p><label class="toggle"><input id="reduce" type="checkbox"> 减少动态效果</label><div id="metrics" class="metrics">按住任务开始拖动</div><div id="checks" class="checks"></div><p class="hint">上下移动选择边界；左右移动调整层级。按 Esc 取消。刷新可恢复数据。</p></aside></div>
<script>
const initial=[{name:'No Group',rows:[['Inbox note',0]]},{name:'work',rows:[['Plan launch',0],['Review copy',1],['Ship draft',0]]},{name:'life',rows:[['Read a chapter',0],['人员绩效 职责 Claude Project',0]]},{name:'side project',rows:[['Sketch ideas',0],['职责落实下去',1],['中粮花生碎改造通知安老师和亚太采购',0]]}];
let groups=initial.map(g=>({name:g.name,rows:g.rows.map(([text,level],i)=>({id:crypto.randomUUID(),text,level}))}));
const list=document.querySelector('#list'), metrics=document.querySelector('#metrics'), checks=document.querySelector('#checks'), reduce=document.querySelector('#reduce');let drag=null,lastDropDelta=0;
reduce.onchange=()=>document.body.classList.toggle('reduce',reduce.checked);
const motion=()=>!reduce.checked&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
const height=r=>r.level?28:32;
function blockHeight(block,base,level){return block.reduce((sum,row)=>sum+height({level:level+row.level-base}),0)}
function layout(gs){let y=0,items=[],bounds=[];gs.forEach((g,gi)=>{items.push({type:'title',gi,y,h:36,name:g.name});y+=36;bounds.push({gi,slot:0,y});g.rows.forEach((r,i)=>{items.push({type:'row',gi,i,row:r,y,h:height(r)});y+=height(r);bounds.push({gi,slot:i+1,y});});});return {items,bounds,height:y};}
function gapLimit(items,target){let nearest=items.filter(it=>it.type==='row').reduce((a,it)=>Math.abs(it.y-target.y)<Math.abs((a?.y??Infinity)-target.y)?it:a,null);return (nearest?.h||32)/2}
function boundedCenter(pointerCenter,targetY,h,limit){const gapCenter=targetY+h/2,offset=Math.min(limit,h/2);return Math.max(gapCenter-offset,Math.min(gapCenter+offset,pointerCenter))}
function rowHTML(r,level=r.level){return `<div class="row ${level?'sub':''}" data-id="${r.id}" style="padding-left:${8+level*22}px"><span class="circle"></span><span class="label"></span><span class="grip">⠿</span></div>`}
function draw(){const model=layout(groups);list.style.height=model.height+'px';list.innerHTML='';for(const it of model.items){let el=document.createElement('div');el.className='item';el.style.transform=`translateY(${it.y}px)`;if(it.type==='title'){el.classList.add('title');el.textContent=it.name}else{el.innerHTML=rowHTML(it.row);el.firstElementChild.querySelector('.label').textContent=it.row.text;el.firstElementChild.addEventListener('pointerdown',start)}list.append(el)}if(!drag){metrics.textContent='按住任务开始拖动';showChecks({});}}
function start(e){if(e.button!==0||drag)return;e.preventDefault();const id=e.currentTarget.dataset.id;let gi=groups.findIndex(g=>g.rows.some(r=>r.id===id)),idx=groups[gi].rows.findIndex(r=>r.id===id),base=groups[gi].rows[idx].level,end=idx+1;while(end<groups[gi].rows.length&&groups[gi].rows[end].level>base)end++;let before=layout(groups), first=before.items.find(i=>i.type==='row'&&i.row.id===id);let block=groups[gi].rows.slice(idx,end).map(r=>({...r})), h=block.reduce((s,r)=>s+height(r),0);const original=groups.map(g=>({name:g.name,rows:g.rows.map(r=>({...r}))}));groups[gi].rows.splice(idx,end-idx);const compact=layout(groups),rect=list.getBoundingClientRect();drag={id,block,base,h,original,compact,grab:e.clientY-rect.top-first.y,startX:e.clientX,pointerY:e.clientY,gi,idx,target:null,center:0,frame:0};list.setPointerCapture(e.pointerId);list.addEventListener('pointermove',move);list.addEventListener('pointerup',drop);list.addEventListener('pointercancel',cancel);renderDrag();update(e.clientX,e.clientY);}
function renderDrag(){list.innerHTML='';const d=drag;list.style.height=(d.compact.height+d.h)+'px';for(const it of d.compact.items){const el=document.createElement('div');el.className='item';el.dataset.y=it.y;el.dataset.type=it.type;if(it.type==='title'){el.classList.add('title');el.textContent=it.name}else{el.innerHTML=rowHTML(it.row);el.firstElementChild.querySelector('.label').textContent=it.row.text}list.append(el)}const gap=document.createElement('div');gap.className='gap';gap.style.height=d.h+'px';list.append(gap);const floating=document.createElement('div');floating.className='floating';floating.style.height=d.h+'px';d.block.forEach(r=>{const wrap=document.createElement('div');wrap.innerHTML=rowHTML(r);wrap.firstElementChild.querySelector('.label').textContent=r.text;floating.append(wrap.firstElementChild)});list.append(floating);d.gap=gap;d.floating=floating;d.items=[...list.querySelectorAll('.item')];}
function choose(c){const d=drag;let compactY=c;if(d.target){let y=d.target.y;if(c>y+d.h)compactY=c-d.h;else if(c>=y)compactY=y;}let best=d.compact.bounds[0],dist=Infinity;for(const b of d.compact.bounds){let v=Math.abs(b.y-compactY);if(v<dist){best=b;dist=v}}return best;}
function update(x,y){if(!drag)return;const d=drag, rect=list.getBoundingClientRect();d.pointerY=y;d.center=y-rect.top-d.grab+d.h/2;let target=choose(d.center), rows=groups[target.gi].rows,prev=rows[target.slot-1];let maxDepth=2-Math.max(...d.block.map(r=>r.level-d.base));let level=Math.max(0,Math.min(maxDepth,prev?prev.level+1:0,d.base+Math.trunc((x-d.startX)/(22*.7))));d.h=blockHeight(d.block,d.base,level);d.center=boundedCenter(y-rect.top-d.grab+d.h/2,target.y,d.h,gapLimit(d.compact.items,target));d.gap.style.height=d.h+'px';d.floating.style.height=d.h+'px';list.style.height=(d.compact.height+d.h)+'px';d.target={...target,level};d.gap.style.transform=`translateY(${target.y}px)`;for(const el of d.items)el.style.transform=`translateY(${+el.dataset.y+(+el.dataset.y>=target.y?d.h:0)}px)`;d.floating.style.transform=`translateY(${d.center-d.h/2}px)`;[...d.floating.children].forEach((el,i)=>{const l=level+d.block[i].level-d.base;el.style.paddingLeft=(8+l*22)+'px';el.classList.toggle('sub',l>0)});drawLine();diagnose();}
function drawLine(){list.querySelector('.line')?.remove();const d=drag,t=d.target;if(!t.level)return;const rows=groups[t.gi].rows;let i=t.slot-1;while(i>=0&&rows[i].level>=t.level)i--;if(i<0)return;const parent=d.compact.items.find(it=>it.type==='row'&&it.row.id===rows[i].id);const line=document.createElement('div');line.className='line';line.style.left=(8+(t.level-1)*22+7)+'px';line.style.top=(parent.y+parent.h/2)+'px';line.style.height=Math.max(0,t.y+d.h/2-parent.y-parent.h/2)+'px';list.append(line)}
function diagnose(){const d=drag,t=d.target,dist=Math.abs(d.center-(t.y+d.h/2));let overlap=[];for(const it of d.compact.items){if(it.type!=='title'&&!(it.type==='row'&&it.i===0))continue;let yy=it.y+(it.y>=t.y?d.h:0),amount=Math.max(0,Math.min(d.center+d.h/2,yy+it.h)-Math.max(d.center-d.h/2,yy));if(amount>d.h/2)overlap.push(it.type==='title'?it.name:groups[it.gi].name+' 首任务');}let limit=gapLimit(d.compact.items,t);let state={gapCount:list.querySelectorAll('.gap').length,distance:dist,limit,overlap,dropDelta:lastDropDelta};metrics.textContent=`目标: ${groups[t.gi].name} / slot ${t.slot} / level ${t.level}\n边界序号: ${d.compact.bounds.indexOf(t===undefined?null:d.compact.bounds.find(b=>b.gi===t.gi&&b.slot===t.slot))}\n空位高度: ${d.h.toFixed(1)} px\n块中心: ${d.center.toFixed(1)} px\n距空位中心: ${dist.toFixed(1)} px`;showChecks(state);window.__dragState={...state,target:{...t},center:d.center,height:d.h,bounds:d.compact.bounds,compactItems:d.compact.items};}
function showChecks(s){const entries=[['空位数 = 1',s.gapCount!=null&&s.gapCount!==1],['中心距离 ≤ 相邻行高一半',s.distance!=null&&s.distance>s.limit],['未覆盖标题或首任务超过半块',s.overlap?.length>0],['落位前后 y 差 ≤ 0.5 px',s.dropDelta>0.5]];checks.innerHTML=entries.map(([label,bad])=>`<div class="check ${bad?'bad':''}">${bad?'●':'○'} ${label}</div>`).join('')+(s.overlap?.length?`<div class="check bad">${s.overlap.join('、')}</div>`:'');}
function move(e){update(e.clientX,e.clientY)}
function finishListeners(){list.removeEventListener('pointermove',move);list.removeEventListener('pointerup',drop);list.removeEventListener('pointercancel',cancel)}
function settle(cancelled){if(!drag)return;const d=drag;finishListeners();let dest=d.target;if(cancelled){d.h=blockHeight(d.block,d.base,d.base);d.gap.style.height=d.h+'px';d.floating.style.height=d.h+'px';[...d.floating.children].forEach((el,i)=>{const level=d.block[i].level;el.classList.toggle('sub',level>0);el.style.paddingLeft=(8+level*22)+'px'});groups=d.original.map(g=>({name:g.name,rows:g.rows.map(r=>({...r}))}));const originalLayout=layout(groups);let originalY=originalLayout.items.find(it=>it.type==='row'&&it.row.id===d.id).y;d.gap.style.transform=`translateY(${originalY}px)`;for(const el of d.items){const old=originalLayout.items.find(it=>it.type==='title'?el.dataset.type==='title'&&el.textContent===it.name:el.querySelector('[data-id]')?.dataset.id===it.row.id);if(old)el.style.transform=`translateY(${old.y}px)`;}d.floating.style.transition=motion()?'transform 120ms ease-out':'';d.floating.style.transform=`translateY(${originalY}px)`;setTimeout(()=>{drag=null;draw()},motion()?140:0);return}d.floating.style.transition=motion()?'transform 120ms ease-out':'';d.floating.style.transform=`translateY(${dest.y}px)`;setTimeout(()=>{const block=d.block.map(r=>({...r,level:dest.level+r.level-d.base}));groups[dest.gi].rows.splice(dest.slot,0,...block);let beforeY=d.floating.getBoundingClientRect().top;drag=null;draw();let afterY=list.querySelector(`[data-id="${d.id}"]`).getBoundingClientRect().top;lastDropDelta=Math.abs(afterY-beforeY);showChecks({dropDelta:lastDropDelta});window.__lastDropDelta=lastDropDelta},motion()?140:0)}
function drop(e){update(e.clientX,e.clientY);settle(false)}function cancel(){settle(true)}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag)cancel()});draw();window.__model=()=>({groups,drag:window.__dragState});
</script></html>
