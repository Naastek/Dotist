<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif;color:#242427;background:#e9e9eb;padding:24px}.card{box-sizing:border-box;width:364px;min-height:130px;border-radius:20px;padding:16px;background:rgba(255,255,255,.72);box-shadow:0 8px 18px #0002,0 20px 35px #0002;line-height:2.2}.name{font-family:serif;font-weight:600}.ball{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:50%;background:#eef4ef;font-size:20px;font-weight:600}.ghost,.hoverrow,.edit{display:block;background:#7772;border-radius:6px;padding:0 6px}.tab{display:inline-block;border-radius:0 9px 9px 0;background:#d6e4da;padding:2px 8px}.swatch{border:2px solid #729b80;border-radius:50%;padding:2px}</style><div class="card"><span class="name">› 工作</span></div><p>组名使用名字字体；点击组头折叠并持久化，折叠时组名旁出现小箭头。右键可更改分组颜色；无分组任务在全部视图顶部且无组头。</p></html>
