<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif;color:#242427;background:#e9e9eb;padding:24px}.card{box-sizing:border-box;width:364px;min-height:130px;border-radius:20px;padding:16px;background:rgba(255,255,255,.72);box-shadow:0 8px 18px #0002,0 20px 35px #0002;line-height:2.2}.name{font-family:serif;font-weight:600}.ball{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:50%;background:#eef4ef;font-size:20px;font-weight:600}.ghost,.hoverrow,.edit{display:block;background:#7772;border-radius:6px;padding:0 6px}.tab{display:inline-block;border-radius:0 9px 9px 0;background:#d6e4da;padding:2px 8px}.swatch{border:2px solid #729b80;border-radius:50%;padding:2px}</style><div class="card"><span style="opacity:.35">◯　原位任务</span><br><span class="ghost">◯　目标占位</span><br><span class="name">无分组　 工作　 生活</span></div><p>被拖行含子树原位 35% 淡化，目标同高灰色 ghost，无跟随光标副本；水平超过 70% 缩进步长才改层级。子层显示圆角 L 连接线和 accent 父圆。Esc 取消、边缘 24 pt 滚动，多选整体拖动；单分组输入栏变分组架含无分组。</p></html>
