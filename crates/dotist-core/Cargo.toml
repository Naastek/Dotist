[package]
name = "dotist-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "dotist_core"

[[bin]]
name = "dotist-mcp"
path = "src/bin/dotist-mcp.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
