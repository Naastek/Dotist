<!doctype html><html data-theme="light"><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../dotist.css"><meta charset="utf-8"><style>body{margin:0} .cs{display:flex;gap:20px} .cc{flex:1;background:var(--material-tint);border-radius:14px;padding:18px;box-shadow:0 0 0 .5px rgba(0,0,0,.12)} .ic{display:grid;place-items:center;height:160px} .trs{display:flex;gap:8px;margin:6px 0 14px} .trs .bar{flex:1;justify-content:center} .cc h4{margin:0 0 6px;font:600 15px/22px var(--font-serif);color:var(--ink);display:flex;align-items:center;gap:8px} .pick{font:500 11px/18px var(--font-sans);color:var(--on-accent);background:var(--accent);padding:0 8px;border-radius:9px} .cc p{margin:0;font:12px/20px var(--font-sans);color:var(--ink-muted)} .bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;height:26px;padding:0 12px;border-radius:8px;font:500 13px/1 -apple-system,'Source Sans 3',sans-serif}
.bar.l{background:rgba(246,246,246,.78);color:#111}.bar.d{background:rgba(30,30,32,.78);color:#f2f2f2}
.bar .g{width:14px;height:10px;border-radius:2px;background:currentColor;opacity:.35}.bar .it{display:flex;align-items:center;gap:4px}</style></head><body><div class="dt-desk"><div class="cs"><div class="cc"><div class="ic"><svg viewBox="0 0 1024 1024" width="150" height="150"><defs><linearGradient id="glight150" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect x="100" y="100" width="824" height="824" rx="186" fill="#f6f4ee"/><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glight150)"/><rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#000" stroke-opacity=".08"/><g transform="translate(152 152) scale(30)"><circle cx="9" cy="12" r="6" fill="none" stroke="#1f1e1b" stroke-width="1.733"/><circle cx="18.8" cy="15.8" r="2.133" fill="#36624e"/></g></svg></div><div class="trs"><div class="bar l"><svg viewBox="0 0 22 22" width="18" height="18" style="color:#111"><g transform="translate(0.1999999999999993 0.1999999999999993) scale(0.9)"><circle cx="9" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.778"/><circle cx="18.8" cy="15.8" r="2.222" fill="currentColor"/></g></svg></div><div class="bar d"><svg viewBox="0 0 22 22" width="18" height="18" style="color:#f2f2f2"><g transform="translate(0.1999999999999993 0.1999999999999993) scale(0.9)"><circle cx="9" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.778"/><circle cx="18.8" cy="15.8" r="2.222" fill="currentColor"/></g></svg></div></div><h4>A · 句号与点「。.」<span class="pick">采用</span></h4><p>左边一个空心圈是中文句号“。”，右下一个实心点是英文句号“.”，两者坐在同一条基线上：一件事写完，画上句号。空心圈也正是界面里的勾选圈，实心点就是 Dot。菜单栏 16px 依然清楚。</p></div><div class="cc"><div class="ic"><svg viewBox="0 0 1024 1024" width="150" height="150"><rect x="100" y="100" width="824" height="824" rx="186" fill="#f6f4ee"/><rect x="262" y="262" width="500" height="500" rx="40" fill="#a8382a"/><text x="512" y="512" dy=".36em" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="330" fill="#f6f4ee">点</text></svg></div><div class="trs"><div class="bar l"><svg viewBox="0 0 22 22" width="18" height="18"><rect x="3.8" y="3.8" width="14.4" height="14.4" rx="2" fill="none" stroke="#111" stroke-width="1.5"/><text x="11" y="11" dy=".36em" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="9.5" fill="#111">点</text></svg></div><div class="bar d"><svg viewBox="0 0 22 22" width="18" height="18"><rect x="3.8" y="3.8" width="14.4" height="14.4" rx="2" fill="none" stroke="#f2f2f2" stroke-width="1.5"/><text x="11" y="11" dy=".36em" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="9.5" fill="#f2f2f2">点</text></svg></div></div><h4>B · 印章“点”</h4><p>最传统的“人文”：方印里一个宋体“点”。但汉字到了菜单栏 16px 笔画会糊成一团，和界面里的元素也没有关系。</p></div><div class="cc"><div class="ic"><svg viewBox="0 0 1024 1024" width="150" height="150"><rect x="100" y="100" width="824" height="824" rx="186" fill="#f6f4ee"/><path d="M742 512 A230 230 0 1 1 512 282" fill="none" stroke="#1f1e1b" stroke-width="52" stroke-linecap="round"/><circle cx="674.63" cy="349.37" r="64" fill="#36624e"/></svg></div><div class="trs"><div class="bar l"><svg viewBox="0 0 22 22" width="18" height="18" style="color:#111"><path d="M17.6 11 A6.6 6.6 0 1 1 11 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.67" cy="6.33" r="1.9" fill="currentColor"/></svg></div><div class="bar d"><svg viewBox="0 0 22 22" width="18" height="18" style="color:#f2f2f2"><path d="M17.6 11 A6.6 6.6 0 1 1 11 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.67" cy="6.33" r="1.9" fill="currentColor"/></svg></div></div><h4>C · 缺口环</h4><p>一圈没画完的线加一个点，能联想到进度。问题是太像“加载中 / 刷新”图标，放在菜单栏容易被当成系统状态。</p></div></div></div><script></script></body></html>
